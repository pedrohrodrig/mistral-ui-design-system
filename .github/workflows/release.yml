name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, versionamento e publicação no npm
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write # criar tag e GitHub Release
      issues: write # comentar nas issues resolvidas
      pull-requests: write # comentar nos PRs incluídos na release
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build da biblioteca
        run: npm run build

      - name: Versionar e publicar (semantic-release)
        run: npx --yes semantic-release@25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
