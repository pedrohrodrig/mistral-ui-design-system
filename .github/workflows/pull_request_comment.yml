name: Comment PR Results

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  comment:
    name: Comment PR
    runs-on: ubuntu-latest

    steps:
      - name: Fetch PR checks
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: "pull_request",
              per_page: 10
            });

            const run = runs.data.workflow_runs.find(r => r.head_sha === pr.head.sha);

            if (!run) {
              console.log("No workflow run found for this PR yet.");
              return;
            }

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id
            });

            const job = jobs.data.jobs[0];
            const steps = job.steps;

            function status(name) {
              const step = steps.find(s => s.name === name);
              if (!step) return "skipped";
              return step.conclusion || "skipped";
            }

            function icon(s) {
              return s === "success" ? "✅" : s === "skipped" ? "⏭️" : "❌";
            }

            const lint = status("Run linting");
            const format = status("Check formatting");
            const test = status("Run tests");
            const build = status("Build project");

            const body = `
            ## 🔍 PR Check Results

            ${icon(lint)} **Linting**: ${lint}
            ${icon(format)} **Formatting**: ${format}
            ${icon(test)} **Tests**: ${test}
            ${icon(build)} **Build**: ${build}

            ---
            *This comment was automatically generated by GitHub Actions*
            `;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body
            });
